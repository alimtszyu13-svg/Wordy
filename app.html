.bk-fb .bk-rep{display:block}
.rep-sheet h3{margin:0}
.rep-ctx{margin:0;padding:10px 12px;border-left:3px solid var(--accent,#F2811D);background:var(--bg);border-radius:0 12px 12px 0;font-size:14.5px;white-space:pre-wrap}
.rep-sheet textarea{width:100%;font:inherit;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line,rgba(0,0,0,.12));background:var(--surface);color:inherit;resize:vertical}
.rep-act{display:flex;justify-content:flex-end;gap:10px}
/* ===== push reminders ===== */
.push-err{color:var(--bad);font-size:14px;margin:0;padding:0 16px 12px;line-height:1.45}
.push-note{color:var(--muted);font-size:13px;margin:0;padding:0 16px 12px}
.push-ask{justify-items:center;text-align:center}
.push-ask h3{margin:0}
.push-ask p{margin:0;color:var(--muted);line-height:1.5}
.push-ask .push-err{padding:0}
.push-ask .chips{justify-content:center}
.push-ask .rep-act{justify-self:stretch;justify-content:center}
/* ===== optional tutorial ask ===== */
.tour-ask{justify-items:center;text-align:center}
.tour-ask h3{margin:0}
.tour-ask p{margin:0;color:var(--muted);line-height:1.5;max-width:42ch}
.tour-ask .rep-act{justify-self:stretch;justify-content:center;flex-wrap:wrap}
.ta-face{transform:scale(1.4);margin:10px 0 6px}
/*GAMES_CSS_END*/
/*GM_CSS_START*/
/* ===================== profile, invites, live quiz ===================== */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.acc-prof{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.acc-ava{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--navy,#23405F);color:#fff;font-weight:700;font-size:17px;letter-spacing:.02em}
.acc-prof-t{flex:1;min-width:0;display:grid;gap:2px}
.acc-prof-t b{font-size:17px;overflow-wrap:anywhere}
.acc-prof-t small{font-size:13px;overflow-wrap:anywhere}
.acc-prof-ed{flex:1;min-width:0;display:grid;gap:8px}
.acc-prof-ed input{width:100%;padding:10px 12px;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.acc-prof-ed input:focus{outline:none;border-color:var(--accent)}
.acc-prof-ed .actions{justify-content:flex-end}
.acc-card>small{margin-top:-4px}
.acc-inv{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.acc-inv li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.acc-inv li span{flex:1;min-width:0;overflow-wrap:anywhere}
.acc-invites{border:1.5px solid var(--accent)}
.acc-inv-row{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.acc-inv-row>div{flex:1;min-width:0;display:grid}
.gm-badge{flex:none;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:4px 9px;border-radius:999px;margin-right:6px}

.gm-tab{display:grid;gap:12px}
.gm-lead{margin:0;font-size:14.5px;line-height:1.5}
.gm-qz{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px 14px}
.gm-qz>div{flex:1;min-width:0;display:grid}

/* editor */
.gm-edit{display:grid;gap:14px}
.gm-src{display:grid;gap:10px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px}
.gm-src select{flex:1;min-width:0;padding:10px 12px;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.gm-qlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.gm-qe{display:grid;gap:10px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px}
.gm-qe-h{display:flex;align-items:center;gap:10px}
.gm-qe-h b{flex:1}
.gm-qe-h .chips{gap:6px}
.chip.small{padding:5px 10px;font-size:13px}
.gm-qe textarea,.gm-qe input{width:100%;padding:10px 12px;font:inherit;font-size:15.5px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}
.gm-qe textarea:focus,.gm-qe input:focus{outline:none;border-color:var(--accent)}
.gm-qe-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gm-qe-opt{display:flex;align-items:center;gap:8px;border-radius:12px;padding:4px 4px 4px 6px;border:1.5px solid var(--line)}
.gm-qe-opt input{border:0;padding:8px 6px;background:transparent}
.gm-qe-opt.on{border-color:var(--tile);background:color-mix(in srgb,var(--tile) 10%,var(--surface))}
.gm-mark{flex:none;width:34px;height:34px;border-radius:9px;border:0;display:grid;place-items:center;background:color-mix(in srgb,var(--tile) 18%,var(--surface));cursor:pointer}
.gm-mark svg{width:16px;height:16px;fill:var(--tile)}
.gm-mark[aria-pressed="true"]{background:var(--tile)}
.gm-mark[aria-pressed="true"] svg{fill:#fff}
.gm-edit-act{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));justify-content:flex-end;background:color-mix(in srgb,var(--bg) 92%,transparent);padding:10px 0;backdrop-filter:blur(6px)}
@media (max-width:520px){ .gm-qe-opts{grid-template-columns:1fr} }

/* tiles: four distinct colours + shapes, so the answer never depends on colour alone */
.tl0{--tile:#D5513A}.tl1{--tile:#2D68B0}.tl2{--tile:#C18410}.tl3{--tile:#23875F}
.lq{display:grid;gap:16px}
.lq:fullscreen{background:var(--bg);padding:32px clamp(16px,5vw,64px);overflow:auto;align-content:start}
.gm-top{display:flex;align-items:center;gap:8px;margin-top:8px}
.gm-top>div{flex:1;min-width:0}
.gm-top h1{font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.gm-play #gm-full{display:none}
.gm-myscore{font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);box-shadow:var(--shadow);padding:6px 12px;border-radius:999px}
.gm-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gm-tile{position:relative;display:flex;align-items:center;gap:12px;min-height:84px;padding:14px 16px;border:0;border-radius:14px;background:var(--tile);color:#fff;text-align:left;font:inherit;font-size:17px;font-weight:600;line-height:1.3;cursor:pointer;transition:transform .12s ease,opacity .2s ease,filter .2s ease}
.gm-tile:not(:disabled):active{transform:scale(.97)}
.gm-tile:disabled{cursor:default}
.gm-shape{flex:none;width:28px;height:28px;display:grid;place-items:center}
.gm-shape svg{width:22px;height:22px;fill:#fff}
.gm-otext{flex:1;min-width:0;overflow-wrap:anywhere}
.gm-cnt{flex:none;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.18);padding:3px 10px;border-radius:999px}
.gm-tile.dim{opacity:.32;filter:saturate(.6)}
.gm-tile.right{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--tile)}
.gm-tile.picked:not(.right){box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
.gm-tile.right::after{content:"✓";position:absolute;top:8px;right:12px;font-weight:800}
.gm-qtext{margin:0;font-size:clamp(20px,3.2vw,34px);font-weight:600;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.gm-host .gm-tile{min-height:clamp(84px,12vh,140px);font-size:clamp(17px,2.2vw,26px)}
.gm-meta{display:flex;align-items:center;justify-content:space-between}
.gm-time{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.gm-ans{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.gm-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gm-bar i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.gm-why{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:15px;line-height:1.5}
.gm-lobby{display:grid;gap:16px;justify-items:center;text-align:center;padding:12px 0}
.gm-how{margin:0;font-size:16px;line-height:1.5}
.gm-count{display:grid;justify-items:center}
.gm-count b{font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.gm-names{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:640px}
.gm-names li{background:var(--surface);box-shadow:var(--shadow);padding:8px 14px;border-radius:999px;font-weight:600;animation:gm-in .3s ease both}
@keyframes gm-in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.gm-lobby .btn{max-width:420px}
.gm-board{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.gm-board li{display:flex;align-items:center;gap:12px;background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:10px 14px}
.gm-board li.me{outline:2px solid var(--accent)}
.gm-board b{flex:1;min-width:0;overflow-wrap:anywhere}
.gm-pl{width:26px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.gm-delta{color:var(--good);font-weight:700;font-variant-numeric:tabular-nums}
.gm-sc{font-weight:700;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.gm-wait{display:grid;justify-items:center;text-align:center;gap:4px;padding:36px 12px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.gm-wait p{margin:0;font-size:17px}
.gm-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);margin-bottom:10px;animation:gm-pulse 1.4s ease-in-out infinite}
@keyframes gm-pulse{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.gm-result{display:grid;justify-items:center;gap:2px;padding:20px;border-radius:var(--r-lg);text-align:center}
.gm-result b{font-size:26px}
.gm-result span{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.gm-result.good{background:var(--good-soft);color:var(--good)}
.gm-result.bad{background:var(--bad-soft);color:var(--bad)}
.gm-result small{color:var(--ink);font-size:14px}
.gm-end{display:grid;gap:14px}
.gm-podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:10px;padding-top:8px}
.gm-pod{display:grid;justify-items:center;gap:4px;text-align:center}
.gm-pod b{font-size:15px;overflow-wrap:anywhere}
.gm-pod span{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.gm-step{width:100%;display:grid;place-items:center;border-radius:12px 12px 4px 4px;color:#fff;font-weight:800;font-size:22px}
.gm-pod.p1 .gm-step{height:120px;background:var(--accent)}
.gm-pod.p2 .gm-step{height:86px;background:var(--navy,#23405F)}
.gm-pod.p3 .gm-step{height:62px;background:color-mix(in srgb,var(--navy,#23405F) 60%,var(--surface))}
.gm-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-lg);background:var(--ink);color:var(--surface);margin:4px 0 8px}
.gm-banner>div{flex:1;min-width:0;display:grid;gap:2px}
.gm-banner small{opacity:.75}
@media (prefers-reduced-motion:reduce){ .gm-names li,.gm-dot{animation:none} .gm-tile,.gm-bar i{transition:none} }

.in-game #wordy-layer{display:none}
.in-game .acc-demo{display:none}
.lq .gm-q{display:grid;gap:14px}
.gm-host .gm-qtext{margin:6px 0 4px}

.acc-pass{position:relative;display:block}
.acc-pass input{padding-right:48px!important}
.acc-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.acc-eye:hover{color:var(--ink);background:var(--bg-2)}
.acc-eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* avatars + account page */
.ava-navy{--ava:#23405F}.ava-orange{--ava:#D9600B}.ava-green{--ava:#2E7D57}.ava-plum{--ava:#6B3F7A}.ava-teal{--ava:#1F7A7A}.ava-rose{--ava:#B4405A}.ava-sand{--ava:#9A7440}.ava-slate{--ava:#4A5563}
.acc-ava{background:var(--ava,#23405F)}
.acc-ava.big{width:64px;height:64px;font-size:22px}
.acc-prof-b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acc-page{display:grid;gap:0}
.acc-sec{gap:10px}
.acc-sec>b{font-size:17px}
.acc-sec p{margin:0;line-height:1.5}
.ap-top{display:flex;align-items:center;gap:14px}
.ap-who{display:grid;gap:2px;min-width:0}
.ap-who b{font-size:18px;overflow-wrap:anywhere}
.ap-l{display:block;font-weight:800;font-size:14px;margin-bottom:6px}
.ap-colors{display:flex;flex-wrap:wrap;gap:10px}
.ap-color{width:36px;height:36px;border-radius:50%;border:0;background:var(--ava);cursor:pointer;box-shadow:0 0 0 2px var(--surface),0 0 0 3px transparent;transition:box-shadow .15s}
.ap-color[aria-checked="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ava)}
.ap-more summary{cursor:pointer;font-weight:700;color:var(--accent-ink);padding:4px 0}
.ap-more[open] summary{margin-bottom:10px}
.ap-out{justify-content:flex-start}
.set-acc{display:flex;align-items:center;gap:12px;min-width:0}
.set-acc .acc-ava{width:40px;height:40px;font-size:15px}
.lvl-sheet h3{margin:0 0 10px;font-size:20px}
.lvl-what{margin:0 0 16px;padding-left:20px;display:grid;gap:8px;line-height:1.5;font-size:15px}
.acc-lvl-l{font-size:13px;align-self:center;margin-right:2px}
#acc-reset-page .acc-card p{margin:0}

/* feedback + legal links */
.fb-form{display:grid;gap:8px;padding:0 16px 16px}
.fb-form textarea,.fb-form input{width:100%;padding:10px 12px;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}
.fb-form textarea:focus,.fb-form input:focus{outline:none;border-color:var(--accent)}
.fb-form .btn{justify-self:start}
.set-legal{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:28px 0 8px;font-size:14px}
.set-legal a{color:var(--muted)}
.acc-teacher{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px;margin:4px 0 12px}
.acc-teacher>div{display:grid;gap:2px;min-width:0}
.acc-teacher p{margin:6px 0 0;line-height:1.5;overflow-wrap:anywhere}
.acc-mem .acc-item .acc-ava{width:36px;height:36px;font-size:13px;flex:none}
.acc-mem .acc-item{gap:12px}
.acc-bio{margin:0 0 10px;font-style:italic;color:var(--muted);overflow-wrap:anywhere}

/* deadlines */
.acc-due{display:block;font-size:13px}
.acc-due.warn{color:var(--accent-ink);font-weight:600}
.acc-due.bad{color:var(--bad);font-weight:700}
.acc-late{color:var(--accent-ink)!important}
.acc-sub{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px}
/* group progress */
.gp{display:grid;gap:12px}
.gp-sum{display:flex;flex-wrap:wrap;gap:8px}
.gp-sum span{background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:7px 13px;font-size:14px}
.gp-sum span.warn b{color:var(--accent-ink)} .gp-sum span.bad b{color:var(--bad)}
.gp-sort{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.gp-scroll{overflow-x:auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.gp-t{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
.gp-t th,.gp-t td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.gp-t thead th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--bg-2)}
.gp-t tbody tr:last-child>*{border-bottom:0}
.gp-t td b{display:block;font-variant-numeric:tabular-nums}
.gp-t td small{display:block;font-size:12.5px}
.gp-t td.warn{color:var(--accent-ink);font-weight:600}
.gp-t td.bad b,.gp-t td.bad small{color:var(--bad)}
.gp-t tbody th{position:sticky;left:0;background:var(--surface);z-index:1;font-weight:400;min-width:170px}
.gp-who{display:flex;align-items:center;gap:10px}
.gp-who .acc-ava{width:32px;height:32px;font-size:12px;flex:none}
.gp-who>span{display:grid}
.gp-weak{max-width:220px;font-size:13px;line-height:1.4}
.gp-note{font-size:13px;margin:0}
/* home homework */
.home-hw{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px;margin:14px 0;border-left:4px solid var(--navy,#23405F)}
.home-hw.late{border-left-color:var(--bad)}
.home-hw-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.home-hw-h b{font-size:17px}
.home-hw ul{list-style:none;margin:0;padding:0}
.home-hw-it{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.home-hw li:first-child .home-hw-it{border-top:0}
.home-hw-it>span{display:grid;min-width:0}
.home-hw-it b{overflow-wrap:anywhere}
.home-hw-it .acc-due{text-align:right;flex:none;max-width:45%}
.set-credit{text-align:center;color:var(--muted);font-size:14px;margin:10px 0 8px}
.set-credit b{color:var(--ink);font-weight:600}

/* one-tap sign-in */
.acc-oauth{display:grid;gap:8px;margin:4px 0 6px}
.acc-oauth.compact{margin:0}
.acc-prov{width:100%;justify-content:center;gap:10px;background:var(--surface)!important;color:var(--ink)!important;border:1.5px solid var(--line)!important;box-shadow:none!important;min-height:48px;font-weight:600}
.acc-prov:hover{border-color:var(--ink)!important}
.acc-prov svg{flex:none}
.acc-or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13.5px;margin:10px 0}
.acc-or::before,.acc-or::after{content:"";flex:1;height:1px;background:var(--line)}
/* guest invitation */
.guest-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin:14px 0;display:grid;gap:10px;border:1.5px solid var(--accent-soft)}
.gc-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.gc-h b{font-size:18px;line-height:1.25}
.guest-card p{margin:0}
.gc-list{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px;line-height:1.45}
.guest-card .btn.wide{width:100%}
/* «Класс» tab: a small dot while not signed in */
#tab-class[data-dot]{position:relative}
#tab-class[data-dot] .nav-ic::after{content:"";position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
/* certificates */
.cert-msg{margin:0;padding:0 16px 14px;line-height:1.5}
.set-row.wrap .acc-oauth{width:100%}

/* profile card: text keeps its width, buttons go to their own row (fix: name and email were squeezed to one letter per line on phones) */
.acc-prof{flex-wrap:wrap}
.acc-prof-t{flex:1 1 180px;min-width:0}
.acc-prof-t b,.acc-prof-t small{overflow-wrap:break-word;word-break:normal}
.acc-prof-t small{overflow:hidden;text-overflow:ellipsis}
.acc-prof-b{flex:1 1 100%;justify-content:flex-start;padding-left:0;flex-wrap:nowrap}
.acc-prof-ed{flex:1 1 220px}
@media (min-width:560px){ .acc-prof-b{flex:0 0 auto;padding-left:0;justify-content:flex-end} }
/* install card + e-mail link */
.inst-card{background:var(--navy,#23405F);color:#fff;border-radius:var(--r-lg);padding:16px;margin:14px 0;display:grid;gap:10px}
.inst-card .muted{color:rgba(255,255,255,.78)}
.inst-card .icon-btn{color:#fff;background:rgba(255,255,255,.12)}
.inst-card .acc-ok{color:#9BE3BF}
.inst-btn{min-height:52px;font-size:17px;gap:10px;background:var(--accent)!important;color:#fff!important}
.inst-steps{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.45;font-size:15px}
:root:not([data-style="play"]) .inst-card{background:#23405F}

window.Fx=(function(){

  const COLORS=['#FF7A12','#FFC23D','#3FC489','#7C5CFF','#FF5F8A','#4CC3FF'];
  let parts=[], running=false, last=0;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function star(x,y,r){ g.beginPath(); for(let i=0;i<8;i++){ const a=i*Math.PI/4, rr=i%2?r*.38:r; g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } g.closePath(); g.fill(); }
  function loop(now){
    const dt=Math.min(.033,(now-last)/1000||.016); last=now;
    g.clearRect(0,0,W,H);
    for(const p of parts){
      p.vy+=p.grav*dt; p.vx*=Math.pow(p.drag,dt*60); p.vy*=Math.pow(p.drag,dt*60);
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; p.flip+=p.vf*dt; p.age+=dt;
      const a=Math.max(0,Math.min(1,(p.life-p.age)/.4));
      g.globalAlpha=a; g.fillStyle=p.c;
      if(p.kind==='star'){ star(p.x,p.y,p.r*(1-p.age/p.life*.5)); }
      else { g.save(); g.translate(p.x,p.y); g.rotate(p.rot); g.scale(1,Math.cos(p.flip)); g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); }
    }
    g.globalAlpha=1;
    parts=parts.filter(p=>p.age<p.life&&p.y<H+60);
    if(parts.length) requestAnimationFrame(loop); else { running=false; g.clearRect(0,0,W,H); }
  }
  function kick(){ if(!running){ running=true; last=performance.now(); requestAnimationFrame(loop); } }
  function center(el){ if(!el) return {x:W/2,y:H/2}; const r=el.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2}; }
  function bump(el){ if(!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  return {
    confetti(el,n){
      if(RM) return; const c=center(el); n=n||70;

    },

    },
    sparkle(el,color){
      if(RM) return; const c=center(el);
      for(let i=0;i<16;i++){ const a=i/16*Math.PI*2+rnd(-.2,.2), s=rnd(140,320);
        parts.push({kind:'star',x:c.x,y:c.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,grav:240,drag:.93,rot:0,vr:0,flip:0,vf:0,r:rnd(3,6),c:color||(i%2?'#FFC23D':'#3FC489'),age:0,life:rnd(.5,.8)}); }

    coinFly(el,n,onEach){
      const target=document.getElementById('coin-pill');
      if(!el||!target){ if(onEach) onEach(); return; }
      const a=center(el), b=center(target); n=n||3;
      for(let i=0;i<n;i++){

        const mx=(a.x+b.x)/2+rnd(-60,60), my=Math.min(a.y,b.y)-rnd(40,110);

        const an=c.animate([

    },
    bump

})();

  function brain(dt){

        else { S.fxLean=d*80*Math.max(0,1-(A.t-1.35)/.45); if(A.fired===2){ A.fired=3; emote('happy',1.4); arm('wave',.7); S.sv-=1.6; } if(A.fired===3&&A.t>1.6){ A.fired=4; say(pick(['Ой! Никто не видел?','Всё в порядке, я специально!','Пол сегодня скользкий…','Упс! Встаю-встаю.'])); } } }
      if(A.type==='sneeze'){ if(A.t<.75){ S.fxLean=-Math.sin(A.t/.75*Math.PI/2)*9; if(!A.fired){ A.fired=1; emote('surprised',.8); } }

  function startAct(){

    if(r<.09){ S.act={type:'hiccup',t:0,fired:0,dur:2.4}; return; }
    if(!sitting&&!RM&&r<.12){ S.act={type:'spin',t:0,fired:0,dur:1.1,lock:true}; return; }
    if(!RM&&r<.16){ butterfly(); return; }
    if(!sitting&&r<.19){ S.act={type:'whistle',t:0,fired:0,dur:2.6}; return; }
    const type=pick(sitting?['look','swing','stretch','hum','flap','look']:['look','stretch','tap','bounce','flap','look']);
    S.act={type,t:0,fired:false,dur:{look:2.4,stretch:1.8,tap:1.3,bounce:.9,swing:2.8,hum:2.6,flap:1.1}[type]};
  }
  function butterfly(){
    const el=document.createElement('div'); el.className='w-fly'; el.innerHTML='<svg viewBox="0 0 24 20" width="22" height="18"><path d="M12 10 C6 0 0 2 2 8 C3 12 8 12 12 10Z M12 10 C18 0 24 2 22 8 C21 12 16 12 12 10Z" fill="#A855F7"/><path d="M12 10 C7 14 4 19 8 19 C10 19 11 15 12 10Z M12 10 C17 14 20 19 16 19 C14 19 13 15 12 10Z" fill="#F472B6"/><rect x="11.2" y="5" width="1.6" height="11" rx=".8" fill="#3B2A1A"/></svg>';
    layer.appendChild(el); S.act={type:'fly',t:0,fired:0,dur:5,el,ox:S.x,oy:S.y-110*S.K}; }
  function startWander(){
    const h=surf('home'); if(!h) return;
    const hero=surf('hero');
    if(hero && onScreen('hero',hero) && Math.random()<.5) S.wander={surface:'hero',frac:rnd(.2,.85),look:0,dur:rnd(4,7)};
    else S.wander={surface:'home',localAbs:clamp(anchorLocal(h)-rnd(70,220),36,h.width-36),look:0,dur:rnd(2.5,4)};

  function fallAsleep(){ snd('yawn'); S.snoreT=2.5; S.sleeping=true; S.emotion='sleepy'; S.emoUntil=0; say('Зева-а-аю… немного вздремну.',2400); }

  function maybeDodge(px,py){
    if(S.mode!=='ground'||S.sleeping||S.t<S.dodgeCD||S.t<S.dodgeCheck) return;

    const bx=S.x, by=S.y+(S.hipY-30*S.s)*S.K;

    const ui=els.find(e=>!layer.contains(e) && e.closest && e.closest('button,a,input,select,textarea,[role="button"]'));

  // ---------- rendering ----------
  function render(ok){
    N.root.style.opacity=ok?1:0;
    const h=clamp(S.h,0,1.12);
    let hs=S.s<1?-24+(1-S.s)*50:-24-(S.s-1)*16; hs=Math.min(hs,-9);
    const hipY=mix(hs-S.bob,4,h)+(h>1?(h-1)*20:0); S.hipY=hipY;
    const idleSway=S.mode==='ground'&&Math.abs(S.vx)<10&&!S.sleeping?Math.sin(S.t*1.7)*1.1*(1-h):0;
    const breath=1+Math.sin(S.t*(S.sleeping?1.3:2.2))*(S.sleeping?.025:.012);
    const sy=S.s*breath, sx=clamp(1+(1-S.s)*.8,.86,1.3);
    N.root.style.transform=`translate3d(${f(S.x-80*S.K)}px,${f(S.y-150*S.K)}px,0) scale(${S.K})`;
    const bx=S.jx+S.shift+idleSway;
    { const bt=`translate(${f(bx)} ${f(hipY+6+S.jy)}) rotate(${f(S.lean)}) scale(${f(sx)} ${f(sy)})`; N.body.setAttribute('transform',bt); N.back.setAttribute('transform',bt); }
    // legs: straight stubby legs, feet planted or swinging over the edge
    const k=smooth(.2,.85,h);
    [[N.legL,N.footL,0],[N.legR,N.footR,1]].forEach(([leg,foot,i])=>{
      const side=i?1:-1;
      const phi=Math.sin(S.swingT+(i?Math.PI:0))*.62*S.swingAmp;
      const dX=side*12+Math.max(0,phi)*side*2, dY=hipY+23*Math.cos(phi), dS=1+.42*Math.sin(phi);

      foot.setAttribute('cx',f(fx+side*2)); foot.setAttribute('cy',f(fy-4.6));

    });

    S.acc.forEach(a=>{
      const ang=a.kind==='flap'?a.s*((RM?0:6*Math.sin(S.t*4.2))+Math.abs(S.wob)*.6-S.dang*.15):a.kind==='swing'?S.dang*a.k:a.kind==='tail'?S.tail:S.wob;

  // ---------- loop ----------
  let last=0;
  function loop(now){
    const dt=Math.min(.033,(now-last)/1000)||.016; last=now;
    S.t+=dt; S.idle+=dt;

    if(S.mode==='ground'&&ok) S.feet.forEach((ft,i)=>{ S.fr[i].x=ft.lx-S.local; S.fr[i].y=ft.ly; });
    common(dt); brain(dt); render(ok||S.mode==='air');
    requestAnimationFrame(loop);
  }
  addEventListener('resize',()=>{ S.K=(innerWidth<520?.78:1)*(S.zoom||1); },{passive:true});
  document.addEventListener('visibilitychange',()=>{ last=performance.now(); S.bpx=null; S.bvx=0; S.bvy=0; });

  addEventListener('pointermove',e=>{
    if(S.t-S.pointer.t>8 && S.started && S.mode==='ground' && !S.sleeping && S.emotion==='neutral' && Math.random()<.6){ snd('hi'); arm('wave',1.2); emote('happy',1.3); }
    S.pointer={x:e.clientX,y:e.clientY,t:S.t}; activity(); maybeDodge(e.clientX,e.clientY);
  },{passive:true});
  ['keydown','wheel','touchstart','pointerdown'].forEach(ev=>addEventListener(ev,activity,{passive:true}));
  N.hit.addEventListener('pointerdown',e=>{ e.stopPropagation(); S.pressT=S.t; S.hugged=false; poke(); });
  ['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,()=>{ S.pressT=null; },{passive:true}));
  N.hit.addEventListener('contextmenu',e=>e.preventDefault());
  // petting: moving the pointer back and forth over Wordy
  let ppx=null,ppy=0; addEventListener('pointermove',e=>{ const mv=ppx==null?0:Math.hypot(e.clientX-ppx,e.clientY-ppy); ppx=e.clientX; ppy=e.clientY; if(!S.started||S.mode!=='ground'||S.t<S.petCD) return; const K=S.K, bx=S.x, by=S.y+(S.hipY-30*S.s)*K;
    if(Math.abs(e.clientX-bx)<38*K&&Math.abs(e.clientY-by)<40*K){ S.pets+=Math.min(60,mv); if(S.pets>320) petted(); } },{passive:true});
  // coming back after a while
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ S.hiddenAt=Date.now(); return; } const away=S.hiddenAt?Date.now()-S.hiddenAt:0; S.hiddenAt=0;
    if(away>120000&&S.started){ setTimeout(()=>{ if(S.sleeping) wake(); snd('hi'); emote('happy',2); arm('wave',1.8); hop(26);
      say(away>3*3600000?pick(['Ты вернулся! Я скучал.','Наконец-то! Продолжим?']):pick(['С возвращением!','О, привет снова!','Я тебя ждал!']),0,true); },500); } });
  // fast scrolling shakes him a little
  addEventListener('scroll',()=>{ const y=scrollY, now=performance.now(), dt=Math.max(16,now-S.scrollT), v=Math.abs(y-S.scrollY)/dt*1000; S.scrollY=y; S.scrollT=now;
    if(!S.started||S.sleeping||S.mode!=='ground') return; if(v>5200&&S.surface!=='home'&&line('scroll',40,['Уф, быстро листаешь!','Держусь крепче!','Вжух! Куда спешим?'])) emote('surprised',.8); },{passive:true});
  // typing: he watches the field and sometimes cheers you on
  let typed=0;
  addEventListener('keydown',e=>{ const t=e.target; if(!t||!t.closest||!t.closest('input,textarea')||!S.started||S.sleeping) return; typed++;
    if(typed%6===1){ const r=t.getBoundingClientRect(); S.lookOverride={x:r.left+Math.min(r.width,40+typed*4),y:r.top+r.height/2,until:S.t+1.2}; }
    if(typed>80&&line('type',50,['Пиши-пиши, я читаю!','Красиво пишешь!','Сколько слов! Ты молодец.'])){ typed=0; emote('happy',1.4); } },{passive:true});
  // pointer leaves the window
  document.addEventListener('mouseout',e=>{ if(e.relatedTarget||!S.started||S.sleeping||S.mode!=='ground') return; if(Math.random()<.35&&line('leave',90,['Ты куда?','Не уходи далеко!'])) emote('sad',1.2); });

  return {
    start(){
      if(S.started) return; S.started=true;
      const h=surf('home');
      S.local=RM&&h?anchorLocal(h):-70; plantFeet();
      last=performance.now(); requestAnimationFrame(loop);
    },
    goTo(surface,opts){
      opts=opts||{};
      const g={surface,anchor:surface==='home'&&opts.frac==null,frac:opts.frac,fast:!!opts.fast};
      if(S.goal.surface===g.surface && S.goal.frac===g.frac && !!S.goal.fast===g.fast) return;
      S.goal=g; S.wander=null; S.nudge=null; S.atGoalT=0; if(!(S.act&&S.act.lock)) S.act=null;
      if(S.sleeping) wake();
    },
    react(kind){
      if(S.sleeping) wake();
      if(!(S.act&&S.act.lock)) S.act=null;
      switch(kind){
        case 'correct': { try{ navigator.vibrate&&navigator.vibrate(18); }catch(e){} emote('joy',1.4); arm('up',.9); hop(34); S.okRun++; S.badRun=0; const r=S.okRun;
          const L={3:['Три подряд!','Три из трёх — так держать!'],5:['Пять подряд! Ты в ударе!','Пять верных подряд!'],10:['Десять подряд! Невероятно!','Десятка без ошибок!'],15:['Пятнадцать подряд! Ты гений?'],20:['Двадцать подряд! Я в восторге!']}[r];
          if(L) setTimeout(()=>{ say(pick(L),0,true); if(r>=5){ arm('up',1.6); hearts(r>=10?5:3); snd('giggle'); } },650); break; }
        case 'wrong': { try{ navigator.vibrate&&navigator.vibrate([30,40,30]); }catch(e){} emote('sad',2.1); S.shake=.55; S.sv-=1.2; setTimeout(()=>snd('aww'),250); const had=S.okRun; S.okRun=0; S.badRun++;
          setTimeout(()=>{ if(had>=5) say(pick(['Ничего, серия была отличная: '+had+' подряд!','Эх! Но '+had+' подряд — это сильно.']),0,true);
            else if(S.badRun===2) line('bad2',30,['Ошибки — это нормально, так и учатся.','Ничего страшного, разберёмся!']);
            else if(S.badRun===4) line('bad4',60,['Давай помедленнее: перечитай вопрос.','Не спеши, подумай ещё раз — у тебя получится.'],true); },700); break; }
        case 'cheer': snd('giggle'); emote('joy',2.8); arm('up',2.4); S.hopApex=44; S.hops=2; hop(44); break;
        case 'happy': emote('happy',2); arm('wave',1.4); hop(22); break;
        case 'encourage': emote('happy',1.8); arm('wave',1.3); break;
        case 'wave': snd('hi'); emote('happy',1.8); arm('wave',1.6); break;
        case 'think': snd('hmm'); emote('think',1.6); break;
        case 'nod': emote('happy',.9); S.sv-=2; break;
        case 'dance': if(RM){ emote('joy',2); arm('up',1.4); break; } S.act={type:'spin',t:0,fired:0,dur:1.1,lock:true,dir:Math.random()<.5?-1:1}; setTimeout(()=>{ if(!S.act) { S.act={type:'spin',t:0,fired:0,dur:1.1,lock:true,dir:-1}; } },1150); break;
        case 'trip': if(!RM){ S.act={type:'trip',t:0,fired:0,dur:2.1,lock:true,dir:Math.random()<.5?-1:1}; } break;
        case 'sneeze': S.act={type:'sneeze',t:0,fired:0,dur:1.5}; break;
      }
    },
    say,
    talk(sec){ S.talkUntil=S.t+(sec||0); },
    /* for the video call: show a feeling, move the mouth with real speech (v = 0..1), change size */
    emo(name,sec){ if(S.sleeping) wake(); const d=sec||2.4;
      if(name==='laugh'){ emote('joy',d); arm('up',1.2); hop(20); snd('giggle'); }
      else if(name==='angry'){ emote('angry',d); S.shake=.5; S.sv-=1; }
      else if(name==='surprised'){ emote('surprised',d); S.sv-=2.4; }
      else if(name==='sad'){ emote('sad',d); }
      else if(name==='love'){ emote('love',d); hearts(3); }
      else if(name==='thinking'||name==='think'){ emote('think',d); }
      else if(name==='wink'||name==='smirk'){ emote('smirk',d); }
      else if(name==='excited'){ emote('joy',d); arm('up',1.4); hop(30); }
      else if(name==='wave'){ emote('happy',d); arm('wave',1.6); }
      else emote(name==='neutral'?'neutral':'happy',d); },
    lip(v){ v=+v; S.lip=isFinite(v)?Math.max(0,Math.min(1,v)):0; S.lipUntil=S.t+.18; },
    zoom(k){ S.zoom=k||1; S.K=(innerWidth<520?.78:1)*S.zoom; },
    wear(eq){
      eq=eq||{}; S.acc=[];
      const all=window.WORDY_ITEMS||[], by={};
      Object.values(eq).forEach(id=>{ const it=all.find(x=>x.id===id); if(it) by[it.slot]=it; });
      const put=(g,it)=>{ g.innerHTML=it?it.svg:'';
        g.querySelectorAll('.swing,.tail,.wob,.flap').forEach(el=>{ const c=el.classList; S.acc.push({el,kind:c.contains('flap')?'flap':c.contains('swing')?'swing':c.contains('tail')?'tail':'wob',
          px:+el.dataset.px||0,py:+el.dataset.py||0,k:+(el.dataset.k||1),s:+(el.dataset.s||1)}); }); };
      put(N.hat,by.hat); put(N.faceacc,by.eyes); put(N.mouthacc,by.mouth); put(N.cheeks,by.cheeks); put(N.neck,by.neck); put(N.suit,by.suit); put(N.back,by.back);
      N.sshade.setAttribute('display',by.suit?'inline':'none');
      S.liftV-=40; S.dangV+=120;
    },
    aim(x,y,sec){ if(S.sleeping) wake(); S.aimAt={x,y}; arm('aim',sec||.4); S.lookOverride={x,y,until:S.t+(sec||.4)+.2}; S.sv-=.5; },
    where(){ return {x:S.x,y:S.y,k:S.K,mode:S.mode,surface:S.surface,started:S.started}; },
    lookAtEl(el,sec){ if(!el) return; const r=el.getBoundingClientRect(); S.lookOverride={x:r.left+r.width/2,y:r.top+r.height/2,until:S.t+(sec||1)}; },
    config(c){ Object.assign(S.cfg,c); if(!S.cfg.talk) N.bubble.classList.remove('show'); if(!S.cfg.sleep&&S.sleeping) wake(); }
  };
})();
</script>
