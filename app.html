<style>
/* Layout: one phone-width column, sticky top bar, fixed bottom nav. Wordy lives in a fixed overlay and perches on real UI edges ([data-perch]). */
:root{
  --bg:#FFF5E8; --bg-2:#FBE9D3; --surface:#FFFFFF; --ink:#2B1B12; --muted:#7E6757; --line:#F0DCC4;
  --accent:#FF7A1A; --accent-strong:#DC5C00; --accent-ink:#A4460A; --accent-soft:#FFE6D0; --on-accent:#2B1200;
  --good:#168A5D; --good-soft:#DCF3E8; --bad:#D2394E; --bad-soft:#FCE2E5; --coin:#F2B10C;
  --shadow:0 1px 0 rgba(120,60,10,.05),0 10px 26px -14px rgba(120,60,10,.32);
  --f-display:"Baloo 2","Nunito Sans",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ipa:"Noto Sans","Nunito Sans","Lucida Sans Unicode",sans-serif;
  --r-lg:26px; --r-md:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B130F; --bg-2:#2B2019; --surface:#251B15; --ink:#FBEEE2; --muted:#BDA594; --line:#3C2C22;
  --accent:#FF8A33; --accent-strong:#C25A0C; --accent-ink:#FFB47C; --accent-soft:#41271A; --on-accent:#2B1200;
  --good:#3FC489; --good-soft:#163629; --bad:#FF6B80; --bad-soft:#41202A; --coin:#F5BE2E;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1B130F; --bg-2:#2B2019; --surface:#251B15; --ink:#FBEEE2; --muted:#BDA594; --line:#3C2C22;
  --accent:#FF8A33; --accent-strong:#C25A0C; --accent-ink:#FFB47C; --accent-soft:#41271A; --on-accent:#2B1200;
  --good:#3FC489; --good-soft:#163629; --bad:#FF6B80; --bad-soft:#41202A; --coin:#F5BE2E;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
kbd{font-family:var(--f-body);font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.08);opacity:.75}
.muted{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 210px}
.topbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;padding:8px 10px 8px 14px;border-radius:20px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);background:var(--surface);background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 10px 30px -18px rgba(90,40,5,.45)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

.page-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:10px 0 56px}
.page-h h1{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.1;text-wrap:balance}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:20px 22px;border-radius:var(--r-lg);background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-strong)}
.hero .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero h2{font-family:var(--f-display);font-size:23px;line-height:1.15;font-weight:800;text-wrap:balance;margin-top:2px}
.hero .sub{font-size:14px;font-weight:700;opacity:.8;margin-top:4px}
.ring text{font-family:var(--f-display);font-weight:800;font-size:17px;fill:var(--on-accent)}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:30px 0 12px}
.sec-h h2{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.2}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:var(--bg-2);border-radius:20px}
.seg button{padding:10px 6px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:0;transition:background .2s,box-shadow .2s}
.seg b{font-family:var(--f-display);font-size:18px;line-height:1.2}
.seg small{font-size:12px;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] b{color:var(--accent-ink)}

.units{display:grid;gap:12px}
.unit{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.num{width:46px;height:46px;border-radius:15px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:21px}
.unit h3{font-family:var(--f-display);font-size:19px;line-height:1.15;font-weight:700}
.unit p{color:var(--muted);font-size:14px;margin:2px 0 9px}
.bar{height:7px;border-radius:9px;background:var(--bg-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.unit-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.best{font-size:12px;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums}

.gram{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.gchip{flex:none;display:flex;flex-direction:column;padding:10px 14px;border-radius:15px;border:1.5px dashed var(--line);color:var(--muted);font-weight:800;font-size:14px;white-space:nowrap;line-height:1.25}
.gchip small{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:15px;font-weight:800;background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-strong);transition:transform .1s,box-shadow .1s;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-strong)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.small{padding:8px 14px;font-size:14px}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 70%,#000)}

.sess-top{display:flex;align-items:center;gap:12px;margin:6px 0 0}
.icon-btn{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.steps{flex:1;display:flex;gap:4px}
.steps i{flex:1;height:9px;border-radius:9px;background:var(--bg-2);transition:background .3s}
.steps i.on{background:var(--accent)} .steps i.good{background:var(--good)} .steps i.bad{background:var(--bad)}
.phase{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}

.flash{perspective:1400px;margin-top:84px}
.flash-inner{position:relative;min-height:320px;transition:transform .6s cubic-bezier(.2,.8,.25,1.08);transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:34px 22px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.face.back{transform:rotateY(180deg)}
.word{font-family:var(--f-display);font-size:clamp(36px,9vw,54px);font-weight:800;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.ipa{font-family:var(--f-ipa);color:var(--muted);font-size:18px}
.tr{font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--accent-ink);line-height:1.1}
.def{color:var(--muted);max-width:40ch}
.ex{font-style:italic;max-width:42ch;margin-top:6px}
.ex mark{background:var(--accent-soft);color:inherit;border-radius:5px;padding:0 3px;font-style:normal;font-weight:800}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.speak{margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.actions.one{grid-template-columns:1fr}
.actions .btn{padding-block:14px}

.qcard,.result{margin-top:84px;background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:28px 20px 20px}
.qcard{text-align:center}
.qask{color:var(--muted);font-weight:700;margin-top:10px}
.qdef{font-family:var(--f-display);font-size:23px;font-weight:600;line-height:1.3;max-width:34ch;margin:6px auto 0;text-wrap:balance}
.opts{display:grid;gap:10px;margin-top:20px;text-align:left}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:17px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;transition:border-color .15s,background .15s,opacity .2s;min-width:0}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:1}
.opt .k{width:27px;height:27px;border-radius:9px;background:var(--bg-2);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.opt.good{border-color:var(--good);background:var(--good-soft)} .opt.good .k{background:var(--good);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .38s} .opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}60%{transform:translateX(5px)}}
.fb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 12px 12px 16px;border-radius:17px;font-weight:800;text-align:left}
.fb.good{background:var(--good-soft);color:var(--good)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:32px}
.score{font-family:var(--f-display);font-size:72px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:30px;color:var(--muted)}
.rewards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.result .actions{width:100%}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{padding:16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.tile b{display:block;font-family:var(--f-display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px;font-weight:700}
.tracks{display:grid;gap:10px}
.trow{padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);display:grid;gap:8px}
.trow header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.trow b{font-family:var(--f-display);font-size:18px}
.hard{display:grid;gap:8px}
.mk-tr{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.ai-rep{font-size:13px;color:var(--muted);margin-top:10px}
.ai-rep-ok{font-size:13px;margin:10px 0 0}
.ai-rep-box{display:grid;gap:8px;margin-top:12px;padding:12px;border-radius:12px;background:var(--bg-2)}
.ai-rep-box textarea{width:100%;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:inherit}
.wmore{display:grid;gap:10px;margin-top:12px}
.wrel-row{display:grid;gap:6px}
.wrel-l{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.wrel-chips{display:flex;flex-wrap:wrap;gap:6px}
.wrel-chip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:inherit;font:inherit;text-align:left;cursor:pointer}
.wrel-chip:disabled{cursor:default;opacity:1}
.wrel-chip:not(:disabled):hover{border-color:var(--accent)}
.wrel-chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrel-chip b{font-size:14px}
.wrel-chip small{font-size:12px;color:var(--muted)}
.wrel-chip.anti b{color:#C2410C}
.wrel-note{max-width:220px}
.wcol{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.wtip{margin:0;font-size:14px;line-height:1.45;padding:10px 12px;border-radius:12px;background:var(--bg-2)}
.wff{font-size:14px;line-height:1.45;padding:10px 12px;border-radius:12px;background:#FFF4D6;color:#5B3A00;border:1px solid #F3D48A}
.wff.small{font-size:13px;padding:8px 10px;margin-bottom:6px}
.wx-btn{justify-self:start}
.card-rel{margin:10px 2px 0}
.card-rel-row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;font-size:14px}
.card-rel-t{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wff{background:#3A2C0A;color:#FBE3A6;border-color:#6B5014}}
:root[data-theme="dark"] .wff{background:#3A2C0A;color:#FBE3A6;border-color:#6B5014}
.prac-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.prac-card{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer}
.prac-card:hover{border-color:var(--accent)}
.prac-card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.prac-card b{display:block;font-size:15px}
.prac-card small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.prac-ic{font-size:22px;line-height:1}
@media (max-width:520px){.prac-row{grid-template-columns:1fr}}
.st-w{font:inherit;color:inherit;background:#FFE3C7;border:0;border-radius:6px;padding:0 4px;cursor:pointer;font-weight:700}

.known-units summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:10px 2px;font-family:var(--f-display);font-weight:700;font-size:17px}
.known-units summary::-webkit-details-marker{display:none}
.known-units summary::before{content:"▸";color:var(--muted);transition:transform .2s;display:inline-block}
.known-units[open] summary::before{transform:rotate(90deg)}
.known-units summary small{font-family:var(--f-body);font-size:12.5px;font-weight:700;color:var(--muted)}
.known-units .unit{opacity:.82}
.gnode.known button{background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--nc) 25%,#fff) 0,color-mix(in srgb,var(--nc) 45%,var(--surface)) 60%);color:color-mix(in srgb,var(--nc) 70%,var(--ink));box-shadow:inset 0 -4px 0 rgba(0,0,0,.06),0 6px 0 color-mix(in srgb,var(--nc) 30%,var(--line))}
.gn-badge.kn{background:var(--surface);color:var(--muted);border-color:var(--bg)}
.kn-label{color:var(--muted);font-size:12px;font-weight:800}
.set-row.wrap{flex-wrap:wrap}
.daily-card{width:100%;margin-top:14px;display:grid;gap:6px;padding:16px 18px;text-align:left;border-radius:var(--r-lg);color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#8B6CFF 0%,#6D4AF0 55%,#5634D6 100%);box-shadow:0 5px 0 #4426B8,0 22px 36px -22px rgba(86,52,214,.9);transition:transform .15s}
.daily-card::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.daily-card:not(:disabled):hover{transform:translateY(-2px)}
.daily-card.done{background:linear-gradient(135deg,color-mix(in srgb,#8B6CFF 30%,var(--surface)),var(--surface));color:var(--ink);box-shadow:none;border:1.5px solid color-mix(in srgb,#7C5CFF 35%,var(--line));cursor:default}
.dc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dc-eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.dc-n{min-width:38px;height:38px;padding:0 10px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.25);font-family:var(--f-display);font-weight:800;font-size:19px}
.daily-card.done .dc-n{background:var(--good-soft);color:var(--good)}
.daily-card b{font-family:var(--f-display);font-size:22px;line-height:1.15}
.dc-words{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.dc-words span{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2);font-weight:800;font-size:13px}
.daily-card.done .dc-words span{background:var(--bg-2)}
.dc-words .more{background:rgba(0,0,0,.18)}
.daily-card small{font-size:13px;font-weight:700;opacity:.85;position:relative;z-index:1}
.onb-wrap{position:fixed;inset:0;z-index:55;overflow-y:auto;padding:150px 16px 40px;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.onb{max-width:560px;margin:0 auto;display:grid;gap:12px;padding:26px 22px 22px;border-radius:30px;background:var(--surface);border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(90,40,5,.5)}
.onb .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.onb h1{font-family:var(--f-display);font-size:28px;line-height:1.1;text-wrap:balance}
.onb h2{font-family:var(--f-display);font-size:18px;margin-top:8px}
.lvl-list{display:grid;gap:8px}
.lvl-opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;transition:border-color .15s,background .15s,transform .15s}
.lvl-opt:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.lvl-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lvl-code{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--bg-2);font-family:var(--f-display);font-weight:800;font-size:18px}
.lvl-opt[aria-pressed="true"] .lvl-code{background:var(--accent);color:var(--on-accent)}
.lvl-opt b{display:block;font-family:var(--f-display);font-size:16px}
.lvl-opt small{color:var(--muted);font-size:13px;font-weight:700}
.onb-note{padding:10px 12px;border-radius:12px;background:var(--bg-2);font-size:13px;font-weight:700;color:var(--muted)}
.onb .chip small{font-weight:700;opacity:.7;margin-left:4px}
.link-btn{justify-self:center;color:var(--muted);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* ---- level progression ---- */
.level-card{width:100%;margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;text-align:left;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);transition:transform .15s,border-color .2s;box-shadow:0 8px 20px -16px rgba(120,60,10,.35)}
.level-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.lc-badge{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:800;font-size:22px;box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 70%,#000)}
.lc-main{display:grid;gap:4px}
.lc-main b{font-family:var(--f-display);font-size:18px;line-height:1.15}
.lc-main small{color:var(--muted);font-weight:700;font-size:13px}
.lc-parts{display:flex;gap:6px;flex-wrap:wrap}
.lc-parts span{padding:2px 8px;border-radius:99px;background:var(--bg-2);font-size:11.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.lc-next{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;border:2px dashed var(--line);color:var(--muted);font-family:var(--f-display);font-weight:800}
.locked-units{margin-top:14px;padding:14px;border-radius:var(--r-md);background:repeating-linear-gradient(135deg,var(--bg-2) 0 10px,color-mix(in srgb,var(--bg-2) 60%,var(--surface)) 10px 20px);border:1px solid var(--line)}
.lu-h{display:flex;gap:12px;align-items:center;color:var(--muted)}
.lu-h svg{width:24px;height:24px;flex:none}
.lu-h b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.lu-h small{font-size:12.5px;font-weight:700}
.lu-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lu-list span{padding:4px 10px;border-radius:99px;background:var(--surface);font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
.lu-list em{font-style:normal;font-weight:800;margin-right:5px;color:var(--ink)}
.ladder{display:grid;gap:8px;margin-bottom:6px}
.rung{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.rung-code{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--bg-2);color:var(--muted);font-family:var(--f-display);font-weight:800;font-size:17px}
.rung-main{display:grid;gap:3px}
.rung-main b{font-family:var(--f-display);font-size:16px}
.rung-main small{color:var(--muted);font-size:12.5px;font-weight:700}
.rung.past .rung-code{background:var(--good-soft);color:var(--good)}
.rung.cur{border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.rung.cur .rung-code{background:var(--accent);color:var(--on-accent)}
.rung.fut{opacity:.6}
.lvlup{position:fixed;inset:0;z-index:58;display:grid;place-items:center;padding:140px 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-x:hidden;overflow-y:auto;
  background:radial-gradient(circle at 50% 45%,#FFB347 0%,#FF7A12 38%,#B83E00 100%);animation:lvlfade .5s ease both}
@keyframes lvlfade{from{opacity:0}}
.lvlup-rays{position:absolute;left:50%;top:45%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;pointer-events:none;opacity:.22;
  background:repeating-conic-gradient(#fff 0 8deg,transparent 8deg 22deg);animation:spinrays 26s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes spinrays{to{transform:rotate(360deg)}}
.lvlup-card{position:relative;width:min(460px,100%);display:grid;gap:12px;justify-items:center;text-align:center;padding:26px 22px 22px;border-radius:32px;background:var(--surface);color:var(--ink);box-shadow:0 40px 80px -30px rgba(80,20,0,.8);animation:lvlpop .7s .15s cubic-bezier(.3,1.5,.5,1) both}
@keyframes lvlpop{from{opacity:0;transform:scale(.6) translateY(40px)}}
.lvlup-card .eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.lvlup-codes{display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-weight:800}
.lvlup-codes .old{font-size:34px;color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px}
.lvlup-codes .arrow{font-size:30px;color:var(--muted)}
.lvlup-codes .new{font-size:72px;line-height:1;padding:6px 18px;border-radius:24px;background:linear-gradient(150deg,#FFC23D,#FF7A12);color:#fff;text-shadow:0 3px 0 rgba(150,60,0,.4);box-shadow:0 6px 0 #C25500;animation:newpop .8s .6s cubic-bezier(.3,1.8,.5,1) both}
@keyframes newpop{from{transform:scale(0) rotate(-20deg)}}
.lvlup-card h1{font-family:var(--f-display);font-size:26px;line-height:1.15;text-wrap:balance}
.lvlup-card p{color:var(--muted);font-weight:700;max-width:38ch}
@media (prefers-reduced-motion: reduce){ .lvlup,.lvlup-card,.lvlup-codes .new,.lvlup-rays{animation:none} }

/* ---- sections, simple explanations ---- */
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px;padding:5px;border-radius:18px;background:var(--bg-2)}
.subtabs button{padding:10px 6px;border-radius:14px;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.glist{display:grid;gap:8px}
.grow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform .15s,border-color .2s}
.grow:hover:not(:disabled){transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.grow:disabled{opacity:.6;cursor:not-allowed}
.grow-n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--f-display);font-weight:800}
.grow-n svg{width:18px;height:18px}
.grow.done .grow-n{background:var(--good-soft);color:var(--good)}
.grow-main{display:grid}
.grow-main b{font-family:var(--f-display);font-size:16px;line-height:1.2}
.grow-main small{color:var(--muted);font-size:12.5px;font-weight:700}
.lc-parts span.ok{background:var(--good-soft);color:var(--good)}
.simple-btn{justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;font-weight:800;font-size:14px;background:color-mix(in srgb,var(--nc,var(--accent)) 12%,var(--surface));color:var(--ink);border:1.5px dashed color-mix(in srgb,var(--nc,var(--accent)) 50%,var(--line));transition:transform .15s}
.simple-btn:hover{transform:translateY(-1px)}
.simple-btn.on{border-style:solid}
.simple-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px;border-radius:18px;background:var(--accent-soft);animation:enter .4s cubic-bezier(.2,.85,.25,1) both}
.simple-box b{font-family:var(--f-display);font-size:16px}
.simple-box p{margin:2px 0 8px;line-height:1.55}
.sb-face svg{width:40px;height:40px}
.sb-hack{display:grid;gap:2px;padding:9px 12px;border-radius:12px;background:var(--surface)}
.sb-hack em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.sb-hack span{font-weight:800}
.help-btn{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.sheet-wrap{position:fixed;inset:0;z-index:57;display:grid;align-items:end;justify-items:center;padding:16px;background:rgba(30,15,5,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{width:min(560px,100%);max-height:80vh;overflow-y:auto;display:grid;gap:12px;padding:18px;border-radius:26px;background:var(--surface);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h b{font-family:var(--f-display);font-size:20px}
.link-btn.inline{display:inline;font-size:13px;margin-left:6px}

/* ---- phone adaptation ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,.opt,.chip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#w-root{transform-origin:0 0}
@media (hover:none){
  .unit:hover,.item:hover,.gentry:hover,.level-card:hover,.review-card.has:hover,.daily-card:not(:disabled):hover,.grow:hover:not(:disabled),
  .seg button:hover,.btn:hover:not(:disabled),.opt:hover:not(:disabled),.icon-btn:hover,.lvl-opt:hover,.simple-btn:hover,.gnode button:hover:not(:disabled){transform:none}
  .btn::after{display:none}
  .opt:hover:not(:disabled){border-color:var(--line)}
}
@media (max-width:520px){
  body{font-size:15px}
  .app{padding-block:0 170px}
  .topbar{padding:6px 8px 6px 12px;border-radius:18px}
  .topbar .brand{font-size:21px}
  .brand svg{width:26px;height:26px}
  .pill{font-size:14px;padding:4px 10px 4px 7px}
  .page-h{margin:8px 0 34px}
  .hero{grid-template-columns:auto minmax(0,1fr);gap:14px;padding:16px}
  .hero h2{font-size:19px}
  .ring{width:64px;height:64px}
  .seg{gap:6px}
  .seg button{padding:10px 4px 8px}
  .seg b{font-size:15px}
  .seg small{font-size:10.5px;line-height:1.25;text-align:center}
  .tglyph{width:36px;height:36px;border-radius:12px}
  .subtabs button{font-size:14px;padding:9px 4px}
  .sec-h{margin:24px 0 10px}
  .sec-h h2{font-size:19px}
  .unit{padding:12px;gap:10px}
  .unit h3{font-size:17px}
  .level-card,.review-card{gap:10px;padding:12px}
  .lc-badge{width:46px;height:46px;font-size:19px}
  .lc-next{display:none}
  .daily-card{padding:14px}
  .daily-card b{font-size:19px}
  .flash,.qcard,.result,.gtheory{margin-top:64px}
  .face{padding:26px 16px 18px}
  .flash-inner{min-height:290px}
  .qcard,.result,.gtheory{padding:22px 16px 16px;border-radius:24px}
  .qdef{font-size:20px}
  .gtheory h2{font-size:28px}
  .formula div{grid-template-columns:auto minmax(0,1fr);font-size:14px}
  .opt{padding:12px 14px}
  .fb{flex-direction:column;align-items:stretch;text-align:center}
  .fb .btn{width:100%}
  .actions .btn{padding-block:13px}
  .stage{padding-top:96px}
  .gbanner{padding:12px}
  .gnode button{width:72px;height:72px;font-size:28px}
  .gnodes{padding-top:70px;gap:34px}
  .lvlup-codes .new{font-size:56px}
  .lvlup-card{padding:22px 16px 18px}
  .lvlup-card h1{font-size:22px}
  .onb-wrap{padding-top:120px}
  .onb{padding:20px 16px 18px}
  .onb h1{font-size:23px}
  .sheet{max-height:85vh;padding:16px}
  .nav{padding-inline:10px}
  .nav-inner{border-radius:22px;padding:5px}
  .nav button{padding:8px 2px 6px;font-size:11px}
  .ach-toast{top:calc(env(safe-area-inset-top,0px) + 64px)}
  .tiles b{font-size:26px}
}
@media (max-width:360px){
  .seg small{display:none}
  .hero{grid-template-columns:1fr}
  .ring{justify-self:start}
}

/* ---- reading & listening ---- */
.subtabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);grid-template-columns:none;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{padding-inline:12px;white-space:nowrap}
.subtabs.two{grid-auto-columns:1fr}
.hint-line{color:var(--muted);font-size:13.5px;font-weight:700;margin:-4px 0 12px}
.read-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cefr-chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:800}
.ok-txt{color:var(--good);font-weight:800;font-size:12.5px}
.reader{margin-top:70px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px 20px 10px;box-shadow:0 18px 40px -24px rgba(120,60,10,.45)}
.reader-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.reader-tools svg{width:16px;height:16px}
.rpara{font-size:17.5px;line-height:1.75;margin:0 0 14px;max-width:65ch}
.rw{display:inline;padding:0 2px;margin:0 -1px;border-radius:5px;font:inherit;color:inherit;background:color-mix(in srgb,var(--accent) 16%,transparent);border-bottom:2px solid color-mix(in srgb,var(--accent) 55%,transparent);cursor:pointer}
.rw.learning{background:color-mix(in srgb,#7C5CFF 16%,transparent);border-bottom-color:color-mix(in srgb,#7C5CFF 55%,transparent)}
.rw.known{background:transparent;border-bottom:2px dotted color-mix(in srgb,var(--good) 70%,transparent)}
.rqs{display:grid;gap:14px}
.rq{padding:16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.rq>b{display:block;font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.rq .opts{margin-top:10px}
#read-result{margin-top:18px}
.word-sheet .sheet-h b{font-family:var(--f-display);font-size:28px}
.word-sheet .tr{font-size:26px}
.ws-btns{display:flex;gap:6px}
.ws-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.ws-state{padding:6px 12px;border-radius:99px;background:var(--bg-2);font-weight:800;font-size:13px}
.ws-state.ok{background:var(--good-soft);color:var(--good)}
.listen-card{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;text-align:left;border-radius:var(--r-md);color:#fff;
  background:linear-gradient(135deg,#4C8DFF,#2F5FE0);box-shadow:0 5px 0 #2148B8,0 20px 34px -22px rgba(47,95,224,.9)}
.listen-card:disabled{opacity:.6}
.listen-card .lc-ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.listen-card .lc-main b{display:block;font-family:var(--f-display);font-size:19px}
.listen-card .lc-main small{opacity:.9;font-weight:700;font-size:13px}
.listen-card .btn{background:#fff;color:#2148B8;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.listen-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.listen-btns svg{width:18px;height:18px}
.fb-tr{display:block;font-weight:700;opacity:.8}
@media (max-width:520px){ .rpara{font-size:16.5px} .reader{padding:16px 16px 6px;margin-top:60px} .listen-card{grid-template-columns:auto minmax(0,1fr)} .listen-card .btn{grid-column:1/-1} }

/* Wordy overlay */
#wordy-layer{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#w-root{position:absolute;left:0;top:0;width:160px;height:190px;will-change:transform}
.w-fly{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;line-height:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.w-heart{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;line-height:0}
#w-dust i{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:0;will-change:transform}
#w-root svg{display:block;overflow:visible;pointer-events:none}
#w-hit{pointer-events:all;cursor:pointer}
.w-bubble{position:absolute;left:0;top:0;width:max-content;max-width:min(230px,70vw);padding:9px 13px;border-radius:17px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:var(--shadow);font-weight:800;font-size:14px;line-height:1.3;opacity:0;transition:opacity .22s;text-align:center}

/* accounts & class */
.acc-wrap{display:grid;gap:4px}
.acc-demo{font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:8px 12px;border-radius:12px;margin:8px 0}
.acc-auth{max-width:460px;margin:0 auto}
.acc-tabs{display:flex;gap:6px;margin:10px 0 14px;padding:4px;background:var(--bg-2);border-radius:14px}
.acc-tabs button{flex:1;padding:9px 10px;border-radius:11px;font-weight:800;color:var(--muted)}
.acc-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.acc-form{display:grid;gap:12px}
.acc-form label{display:grid;gap:5px;font-weight:800;font-size:14px}

.acc-form input:focus,.acc-form textarea:focus,.acc-card input:focus,.acc-review textarea:focus,.acc-review input:focus{outline:none;border-color:var(--accent)}
.acc-roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc-roles button{display:grid;gap:3px;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.acc-roles button b{font-family:var(--f-display);font-size:18px}
.acc-roles button small{color:var(--muted);font-size:12.5px;line-height:1.35}
.acc-roles button.on{border-color:var(--accent);background:var(--accent-soft)}
.acc-err{color:var(--bad);font-weight:700;font-size:14px;margin:0}
.acc-ok{color:var(--good);font-weight:800;font-size:14px;margin:0}
.acc-note{font-size:13px;margin:0}
.acc-head{display:flex;align-items:center;gap:12px;margin:12px 0 12px}
.acc-head>div{flex:1;min-width:0}
.acc-head h1{font-family:var(--f-display);font-size:26px;line-height:1.12;overflow-wrap:anywhere}
.acc-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;display:grid;gap:8px;margin-bottom:14px}
.acc-card p{margin:0}
.acc-row{display:flex;gap:8px}
.acc-row input{flex:1;min-width:0}
.acc-codein{text-transform:uppercase;letter-spacing:.12em;font-weight:800!important;font-variant-numeric:tabular-nums}
.acc-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.acc-item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.acc-item>div{flex:1;min-width:0;display:grid;gap:2px}
.acc-item b{font-size:16px;overflow-wrap:anywhere}
.acc-item:disabled{opacity:.6;cursor:default}
.acc-code-mini{font-weight:800;letter-spacing:.08em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.acc-codecard{background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:18px;display:grid;gap:6px;justify-items:start;margin-bottom:14px}
.acc-codecard .phase,.acc-codecard .muted{color:inherit;opacity:.75}
.acc-code{font-family:var(--f-display);font-size:44px;font-weight:800;letter-spacing:.1em;font-variant-numeric:tabular-nums;line-height:1.05}
.acc-codecard .btn.ghost{background:transparent;color:var(--bg);border:2px solid rgba(255,255,255,.4);box-shadow:none}
.acc-st{flex:none;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--bg-2);color:var(--muted)}
.acc-st.warn{background:var(--accent-soft);color:var(--accent-ink)} .acc-st.good{background:var(--good-soft);color:var(--good)} .acc-st.bad{background:var(--bad-soft);color:var(--bad)}
.acc-mem .acc-memx{display:grid;gap:10px;padding:12px 6px 4px}
.acc-stats,.acc-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acc-stats span,.acc-sum span{display:grid;justify-items:center;text-align:center;padding:10px 4px;border-radius:12px;background:var(--bg-2)}
.acc-stats b,.acc-sum b{font-family:var(--f-display);font-size:20px}
.acc-stats small,.acc-sum small{font-size:11.5px;color:var(--muted);line-height:1.25}
.acc-sum{margin:12px 0}
.acc-task{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.acc-pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin:0}
.acc-files{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.acc-files li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg-2)}
.acc-files a{flex:1;min-width:0;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.acc-up{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.acc-count{justify-self:end;font-size:12.5px;color:var(--muted);font-weight:700}
.acc-count.warn{color:var(--bad)}
.acc-answer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:16px}
.acc-mark{background:color-mix(in srgb,var(--accent) 22%,transparent);border-bottom:2px solid var(--accent);border-radius:3px;cursor:pointer;color:inherit}
.acc-mark.on{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.acc-split{display:grid;gap:14px}
.acc-left,.acc-right{display:grid;gap:10px;align-content:start}
.acc-tip{font-size:13px;margin:0}
.acc-addc{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--bg-2)}
.acc-addc b{font-size:14px;overflow-wrap:anywhere}
.acc-clist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.acc-clist li{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;display:grid;gap:4px}
.acc-clist li.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.acc-clist q{font-size:13px;color:var(--muted);font-style:italic}
.acc-clist p{margin:0;font-size:14.5px}
.acc-clist .link-btn{justify-self:start;font-size:12.5px}
.acc-fb{display:grid;gap:5px;font-weight:800;font-size:14px}
.acc-fbbox{background:var(--good-soft);border-radius:var(--r-lg);padding:14px;display:grid;gap:10px;margin-bottom:10px}
.acc-vers summary,.acc-danger summary{cursor:pointer;font-weight:800;color:var(--muted);padding:8px 0}
.acc-ver{padding:8px 0;border-top:1px solid var(--line)}
.acc-danger{margin-top:18px}
@media (min-width:860px){ .acc-split{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)} .acc-right{position:sticky;top:84px} .acc-split.small{grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr)} }
@media (max-width:440px){ .acc-roles{grid-template-columns:1fr} .acc-stats,.acc-sum{grid-template-columns:repeat(2,1fr)} .acc-code{font-size:36px} }


.bk-rev{display:block;margin:10px 0 -6px 36px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bk-items .bk-rev{text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:700;color:var(--ink);opacity:.8}

/* «Строгий» стиль: спокойнее, меньше игровых эффектов */

:root[data-style="pro"] .btn.ghost{box-shadow:none}
:root[data-style="pro"] .btn::after{display:none}
:root[data-style="pro"] .opt{border-radius:12px}
:root[data-style="pro"] .gnode button{box-shadow:none;background:var(--nc)}

:root[data-style="pro"] .daily-card{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line);border-left:5px solid #6B4BE0;box-shadow:var(--shadow)!important}

/* grammar helper */

/* ===================== Modern look (default). «Игровой» = [data-style="play"] keeps the old look ===================== */
:root:not([data-style="play"]){
  --bg:#F2F3EF; --bg-2:#E8EAE4; --surface:#FFFFFF; --ink:#18202B; --muted:#5E6672; --line:#DFE2DA;
  --accent:#E8650C; --accent-strong:#C9550A; --accent-ink:#B04C06; --accent-soft:#FCEADB; --on-accent:#FFFFFF;
  --navy:#23405F; --navy-soft:#E3E9F0;
  --good:#1F8A5B; --good-soft:#DFF1E7; --bad:#C43A31; --bad-soft:#FBE4E1; --coin:#E3A008;
  --shadow:0 1px 2px rgba(20,28,40,.05),0 4px 16px -10px rgba(20,28,40,.18);
  --f-display:"Onest","Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Onest","Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --r-lg:16px; --r-md:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-style="play"]):not([data-theme="light"]){
  --bg:#11151B; --bg-2:#1B212A; --surface:#181D25; --ink:#EBEDF0; --muted:#9AA2AE; --line:#2A313C;
  --accent:#FF8633; --accent-strong:#D9671B; --accent-ink:#FFAD70; --accent-soft:#3A2618; --on-accent:#1A0E05;
  --navy:#9DB8D6; --navy-soft:#1E2A38;
  --good:#45C08A; --good-soft:#15302A; --bad:#FF7468; --bad-soft:#3A1F1E; --coin:#F2BE3A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px -12px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]:not([data-style="play"]){
  --bg:#11151B; --bg-2:#1B212A; --surface:#181D25; --ink:#EBEDF0; --muted:#9AA2AE; --line:#2A313C;
  --accent:#FF8633; --accent-strong:#D9671B; --accent-ink:#FFAD70; --accent-soft:#3A2618; --on-accent:#1A0E05;
  --navy:#9DB8D6; --navy-soft:#1E2A38;
  --good:#45C08A; --good-soft:#15302A; --bad:#FF7468; --bad-soft:#3A1F1E; --coin:#F2BE3A; color-scheme:dark }

:root:not([data-style="play"]) body{font-size:16px;letter-spacing:-.003em}
:root:not([data-style="play"]) #bg-deco{display:none}
:root:not([data-style="play"]) :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* type: one confident sans, tighter headings, no shouting labels */

:root:not([data-style="play"]) .page-h h1{font-size:28px;font-weight:700}

:root:not([data-style="play"]) .phase,:root:not([data-style="play"]) .eyebrow,:root:not([data-style="play"]) .dc-eyebrow,:root:not([data-style="play"]) .hero .eyebrow,:root:not([data-style="play"]) .onb .eyebrow,:root:not([data-style="play"]) .bk-toc>b,:root:not([data-style="play"]) .bk-key>b,:root:not([data-style="play"]) .bk-note>b,:root:not([data-style="play"]) .bk-tbl th,:root:not([data-style="play"]) .bk-rev,:root:not([data-style="play"]) .ghead .eyebrow,:root:not([data-style="play"]) .gn-here{text-transform:none;letter-spacing:0;font-weight:600;font-size:13px}

/* top bar & nav: quiet frames */
:root:not([data-style="play"]) .topbar{border-radius:14px;box-shadow:none;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent)}
:root:not([data-style="play"]) .topbar .brand{font-size:21px;font-weight:700;letter-spacing:-.03em}
:root:not([data-style="play"]) .pill{background:transparent;border:1px solid var(--line);font-weight:600;font-size:14px;padding:4px 10px 4px 7px}

/* buttons: flat, firm, no 3D */
:root:not([data-style="play"]) .btn{border-radius:10px;font-weight:600;box-shadow:none;padding:11px 18px;transition:background .15s,border-color .15s}
:root:not([data-style="play"]) .btn:hover:not(:disabled){background:var(--accent-strong)}

:root:not([data-style="play"]) kbd{display:none}

:root:not([data-style="play"]) .daily-card::before,:root:not([data-style="play"]) .daily-card::after{display:none}

/*GAMES_CSS_START*/
.games-entry{width:100%;margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;text-align:left;border-radius:var(--r-md);background:linear-gradient(120deg,color-mix(in srgb,#7C5CFF 13%,var(--surface)),var(--surface) 72%);border:1.5px solid color-mix(in srgb,#7C5CFF 35%,transparent);color:var(--ink);transition:transform .15s}
.games-entry:hover{transform:translateY(-2px)}
.ge-ic{width:46px;height:46px;border-radius:15px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:8px;background:linear-gradient(150deg,#9B82FF,#6A4BEA)}
.ge-ic i{border-radius:4px;background:rgba(255,255,255,.9)} .ge-ic i:nth-child(2){background:#FFD24A} .ge-ic i:nth-child(3){background:#5FE0A6}
.games-entry small{color:var(--muted)}
.games-h{margin-top:70px;margin-bottom:12px;padding:18px 18px 14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.games-h h2{margin:0}
.game-card{width:100%;margin-top:12px;display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center;padding:16px;text-align:left;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow);transition:transform .15s}
.game-card:hover{transform:translateY(-2px)}
.gc-main{display:grid;gap:4px} .gc-main b{font-family:var(--f-display);font-size:20px} .gc-main small{color:var(--muted);line-height:1.4} .gc-main em{font-style:normal;font-size:12px;font-weight:800;color:var(--accent-ink)}
.gc-art{height:92px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden}
.gc-word .gc-art{background:var(--bg-2)}
.gc-word .gc-art i{width:22px;height:26px;display:grid;place-items:center;border-radius:6px;font-style:normal;font-weight:800;font-size:14px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.gc-word .gc-art i.g{background:var(--good);border-color:var(--good);color:#fff} .gc-word .gc-art i.y{background:#E9A90B;border-color:#E9A90B;color:#fff}
.gc-catch .gc-art{background:linear-gradient(180deg,#CFE9FF,#FFF1DE);flex-direction:column}
.gc-art .fall{font-style:normal;font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;background:#fff;color:#2B1B12;box-shadow:0 2px 0 rgba(0,0,0,.12);animation:gcfall 2.6s ease-in infinite}
.gc-art .fall.b{animation-delay:1.3s;margin-left:34px;text-decoration:line-through;color:#B23246}
@keyframes gcfall{0%{transform:translateY(-46px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(46px);opacity:0}}
@media (max-width:440px){ .game-card{grid-template-columns:84px minmax(0,1fr);gap:12px} .gc-art{height:80px} .gc-word .gc-art i{width:17px;height:21px;font-size:11px} }

/* word game */
.wg-head{margin-top:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.wg-head div{display:grid} .wg-head small{color:var(--muted)} .wg-head .lvl-chip{align-self:center}
.wg-hints{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.wg-hints::-webkit-scrollbar{display:none}
.wg-hb{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:800;color:var(--ink)}
.wg-hb em{display:inline-flex;align-items:center;gap:2px;font-style:normal;color:var(--muted)} .wg-hb em svg{width:14px;height:14px}
.wg-hb.used,.wg-hb:disabled{opacity:.5}
.wg-hint-box{margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--accent-soft);font-size:14px;display:grid;gap:3px}
.wg-hint-box p{margin:0} .wg-mask{font-family:var(--f-display);font-weight:800;letter-spacing:.12em}
.wg-grid{--sz:max(34px,min(56px,calc((min(100vw,680px) - 48px - (var(--len) - 1) * 6px) / var(--len)),calc((100svh - 610px) / var(--tries,6))));display:grid;gap:6px;justify-content:center;margin:16px 0 4px}
.wg-row{display:grid;grid-template-columns:repeat(var(--len),var(--sz));gap:6px}
.wg-row.shake0,.wg-row.shake1{animation:shake .38s}
.wg-row.shake1{animation-name:shake2} @keyframes shake2{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}60%{transform:translateX(5px)}}
.wg-t{height:var(--sz);display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:calc(var(--sz) * .48);color:var(--ink)}
.wg-t.fill{border-color:var(--accent);animation:wgpop .12s}
.wg-t.hint{color:color-mix(in srgb,var(--ink) 35%,transparent);border-style:dashed}
.wg-t.g,.wg-t.y,.wg-t.x{color:#fff;animation:wgflip .5s calc(var(--k) * 90ms) both}
.wg-t.g{background:var(--good);border-color:var(--good)} .wg-t.y{background:#E9A90B;border-color:#E9A90B} .wg-t.x{background:#9C8A7C;border-color:#9C8A7C}
@keyframes wgpop{50%{transform:scale(1.08)}}
@keyframes wgflip{0%{transform:rotateX(0);background:var(--surface);border-color:var(--line);color:var(--ink)}49%{transform:rotateX(90deg);background:var(--surface);border-color:var(--line);color:var(--ink)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.wg-msg{min-height:22px;text-align:center;font-weight:800;color:var(--accent-ink);margin:4px 0}
.wg-kb{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;gap:6px;margin:6px auto 0;max-width:540px;padding:8px;border-radius:20px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);user-select:none}
.wg-kb>div{display:flex;gap:5px;justify-content:center}
.wg-k{flex:1;max-width:44px;height:50px;border-radius:10px;background:var(--bg-2);border:none;font-weight:800;font-size:16px;text-transform:uppercase;color:var(--ink);touch-action:manipulation}
.wg-k.wide{max-width:72px;flex:1.6;font-size:13px;text-transform:none}
.wg-k.g{background:var(--good);color:#fff} .wg-k.y{background:#E9A90B;color:#fff} .wg-k.x{background:#9C8A7C;color:#fff;opacity:.55}
.wg-k:active{transform:translateY(1px)}
.wg-reveal{margin-top:8px;padding:18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:6px;text-align:center;justify-items:center}
.wg-word{display:flex;align-items:center;gap:10px} .wg-word b{font-family:var(--f-display);font-size:32px} .wg-word small{color:var(--muted)}
.wg-ru{margin:0;font-size:18px;font-weight:800} .wg-reveal p{margin:0} .wg-ex{font-style:italic}
.wg-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:8px}

/* catch game */
.cw-intro{margin-top:70px;padding:16px 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.cw-intro p{margin:4px 0 0;color:var(--muted)}
.cw-topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cw-topic{display:grid;gap:3px;align-content:start;padding:12px 14px;text-align:left;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);color:var(--ink);transition:transform .15s,border-color .2s}
.cw-topic:hover{transform:translateY(-2px);border-color:var(--accent)} .cw-topic small{color:var(--muted);line-height:1.3}
.cw-hearts{display:flex;gap:2px;font-size:20px} .cw-hearts i{font-style:normal;color:var(--line)} .cw-hearts i.on{color:var(--bad)}

.cw-sign{margin:10px auto 8px;width:max-content;max-width:100%;padding:8px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:800;text-align:center;box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 60%,#000)}
.cw-field{touch-action:none;cursor:grab;position:relative;height:clamp(360px,calc(100svh - 280px),600px);border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(180deg,#CFE9FF 0%,#EAF5FF 55%,#FFF1DE 100%);border:1px solid var(--line);user-select:none}

@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .cw-field{background:linear-gradient(180deg,#1C2A3C,#22283A 55%,#2B2019)} }
.cw-layer{position:absolute;inset:0;pointer-events:none}
.cw-basket{display:none;position:absolute;left:0;bottom:46px;width:68px;height:34px;border-radius:0 0 34px 34px;background:var(--accent);box-shadow:inset 0 6px 0 rgba(255,255,255,.35);pointer-events:none}
:root[data-wordy="hidden"] .cw-basket{display:block}
.cw-word{pointer-events:none;position:absolute;left:0;top:0;padding:9px 14px;border-radius:99px;background:#fff;color:#2B1B12;border:2px solid #FFD9B5;font-weight:800;font-size:16px;white-space:nowrap;box-shadow:0 3px 0 rgba(120,60,10,.18);will-change:transform;touch-action:manipulation;}
.cw-word.got{animation:cwgot .32s forwards;background:var(--good);border-color:var(--good);color:#fff}

.cw-word.splash{animation:cwfade .45s forwards}
@keyframes cwgot{to{opacity:0;scale:1.35}} @keyframes cwbad{0%,30%{opacity:1}100%{opacity:0}} @keyframes cwfade{to{opacity:0;scale:.7}}
.cw-ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,#8BCF6B,#5FAE47);border-top:3px solid #4E9A3A}

.cw-puddle{position:absolute;left:50%;bottom:8px;width:120px;height:14px;margin-left:-60px;border-radius:50%;background:rgba(80,150,220,.45)}
.cw-over{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;gap:8px;padding:20px;text-align:center;background:color-mix(in srgb,var(--surface) 90%,transparent);overflow:auto}

@media (prefers-reduced-motion:reduce){ .gc-art .fall{animation:none} .wg-t.g,.wg-t.y,.wg-t.x{animation:none} }
.gc-cross .gc-art{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}

.cx-tool b{font-size:15px} .cx-tool small{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted)} .cx-tool small svg{width:12px;height:12px}

.cx-list{display:grid;gap:4px;text-align:left;min-width:220px} .cx-list p{margin:0;display:flex;align-items:center;gap:6px}

@media (max-width:400px){ .cx-tool{width:48px;height:52px} .cx-l{width:46px;height:46px;margin:-23px;font-size:23px} }

/* ---- polish v2 ---- */
.gc-word{--gc:#1F8A5B} .gc-cross{--gc:var(--accent)} .gc-catch{--gc:#2F7FC1}
.games-h{position:relative;margin-top:86px;padding:18px 18px 16px;border-radius:var(--r-lg);background:linear-gradient(150deg,#22303F,#18212C);color:#F3F5F8;border:1px solid rgba(255,255,255,.06);overflow:hidden}

@media (max-width:440px){ .game-card{grid-template-columns:78px minmax(0,1fr);column-gap:12px} .gc-art{min-height:78px} .gc-tiles{grid-template-columns:repeat(2,27px)} .gc-tiles i{height:27px} .gc-main small{font-size:13px} }

/* word game */
.wg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}

.wg-dots i.now{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)} .wg-dots i.ok{background:var(--good);border-color:var(--good)}

.cx-tool{border-radius:16px;box-shadow:0 2px 0 var(--line)} .cx-tool:active{transform:translateY(2px);box-shadow:none}

.cw-ground,:root[data-theme="dark"] .cw-ground{height:46px;background:linear-gradient(180deg,#B3724C,#97603F);border-top:4px solid #7E4E32}

@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .cw-ground{background:linear-gradient(180deg,#151D2B,#10161F);border-top-color:#0C1119} }
.cw-field{transition:box-shadow .2s}

@keyframes cwhurt2{0%{box-shadow:inset 0 0 0 0 rgba(220,50,50,0)}25%{box-shadow:inset 0 0 0 6px rgba(220,50,50,.85),inset 0 0 60px rgba(220,50,50,.35)}100%{box-shadow:inset 0 0 0 0 rgba(220,50,50,0)}}
.cw-word{background:#FFFDF9;color:#2B1B12;box-shadow:0 3px 0 rgba(120,60,20,.2),0 8px 16px -8px rgba(120,60,20,.4)}

/* ---- victory card ---- */

.gw-accent{--gw:var(--accent)} .gw-sky{--gw:#2F7FC1}

.gk .rn-chip.on,.gk .sp-mode.on{border-color:var(--gc);background:var(--gc-soft);color:var(--gc-ink)}

.gk .rn-start,.gk .sp-start,.gk .g-start{display:block;width:calc(100% - 36px);max-width:420px;height:56px;margin:4px auto 0;border-radius:16px;font-size:18px;font-weight:800;background:var(--gc);color:#fff;box-shadow:0 4px 0 var(--gc-ink),0 14px 26px -14px var(--gc)}
.gk .rn-start:active,.gk .sp-start:active,.gk .g-start:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gc-ink)}
/* lists of topics / rooms */
.gk .cw-topic,.gk .esc-room{border-radius:16px;transition:transform .15s,border-color .2s,box-shadow .2s}
.gk .cw-topic:hover,.gk .esc-room:not(:disabled):hover{box-shadow:0 10px 22px -16px var(--gc)}
.gk .esc-go{background:var(--gc)} .gk .esc-prog{color:var(--gc)!important} .gk .esc-rn{background:var(--gc-soft);color:var(--gc-ink)}
/* in-game cards / HUD */
.gk .wg-head,.gk .tt-hud,.gk .dr-card{border-radius:18px;border-color:var(--gc-line)}
.gk .wg-head .lvl-chip{background:var(--gc);color:#fff}
.gk .dr-chip,.gk .tt-hud .dr-chip{background:var(--gc-soft)!important;color:var(--gc-ink)!important}
.gk .dr-score,.gk .tt-hud .dr-score{color:var(--gc-ink)}
.gk .cw-hearts i.on{color:#E5484D;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.gk .cw-sign{border-radius:12px}
/* action buttons inside games */
.gk .wg-actions .btn:not(.ghost),.gk #esc-try,.gk #esc-use,.gk #tt-drop,.gk .rn-jump{background:var(--gc);box-shadow:0 3px 0 var(--gc-ink)}
.gk .gw-actions .btn:not(.ghost){background:var(--gc);box-shadow:0 4px 0 var(--gc-ink)}
.gk .gw-actions .btn{height:52px;border-radius:16px}
.gk .btn.ghost{border-radius:14px}
/* fields get one consistent frame */
.gk .cw-field,.gk .sp-field,.gk .dr-stage,.gk .esc-scene,.gk .tt-well,.gk .rn-field{border-radius:22px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 20px 40px -24px rgba(0,0,0,.45)}
/* keyboards */
.gk .wg-k{border-radius:10px;font-family:var(--f-display)}
.gk .sp-kb .wg-k.hint{background:var(--gc);border-color:var(--gc)}
/* focus */
.gk button:focus-visible{outline:3px solid color-mix(in srgb,var(--gc) 60%,transparent);outline-offset:2px}

/* ---- plan card (Wordy coach) ---- */
.plan-card{margin-top:14px;padding:14px;border-radius:var(--r-lg);background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 11%,var(--surface)),var(--surface) 65%);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));box-shadow:var(--shadow)}
.plan-card.all{background:linear-gradient(160deg,color-mix(in srgb,var(--good) 14%,var(--surface)),var(--surface) 65%);border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.pl-h{display:flex;align-items:center;gap:12px} .pl-h>div{flex:1;display:grid} .pl-h b{font-family:var(--f-display);font-size:17px} .pl-h small{color:var(--muted);font-size:13px}
.pl-face{position:relative;flex:none;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FF9A45,#FF7A12 60%,#E5600A);box-shadow:0 3px 0 #C2410C}
.pl-face i{position:absolute;top:13px;width:7px;height:9px;border-radius:50%;background:#fff} .pl-face i:first-child{left:11px} .pl-face i:last-child{left:21px}
.pl-face i::after{content:"";position:absolute;left:2px;top:3px;width:4px;height:4px;border-radius:50%;background:#24130A}
.pl-n{font-family:var(--f-display);font-weight:800;font-size:15px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.pl-bar{height:6px;margin:12px 0 8px;border-radius:99px;background:var(--bg-2);overflow:hidden} .pl-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#FFB347);transition:width .6s cubic-bezier(.3,.8,.3,1)}
.plan-card.all .pl-bar i{background:var(--good)}
.pl-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pl-list li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.pl-chk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--bg-2);color:var(--muted)}
.pl-list li.done .pl-chk{background:var(--good);color:#fff;animation:wgpop .35s}
.pl-main{display:grid} .pl-main b{font-size:14.5px} .pl-main small{color:var(--muted);font-size:12.5px;line-height:1.3}
.pl-list li.done .pl-main b{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);color:var(--muted)}
.pl-ok{font-size:12px;font-weight:800;color:var(--good)}
.pl-reward{display:flex;align-items:center;gap:5px;justify-content:center;margin:10px 0 0;font-size:13px;font-weight:700;color:var(--muted)} .pl-reward svg{width:15px;height:15px}

/* ---- Wordy's house ---- */
.hs-hero{position:relative;margin-top:12px;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.hs-ext{display:block;width:100%;height:auto}

.hs-comfort{display:block;width:120px;height:6px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden} .hs-comfort i{display:block;height:100%;background:linear-gradient(90deg,#FF9A3C,#F43F5E);border-radius:inherit}
.hs-up{width:100%;margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;text-align:left;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface));border:1.5px solid color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--ink)}
.hs-up span{flex:1;display:grid} .hs-up small{color:var(--muted);font-size:12.5px}
.hs-up em{flex:none;display:inline-flex;align-items:center;gap:4px;font-style:normal;font-weight:800;padding:8px 12px;border-radius:12px;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-strong)} .hs-up em svg{width:16px;height:16px}
.hs-up:active em{transform:translateY(2px);box-shadow:none}
.hs-max{margin:12px 0 0;text-align:center;font-weight:700;color:var(--muted)}
.hs-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hs-room{display:grid;gap:8px;padding:8px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--ink);transition:transform .15s,box-shadow .2s}
.hs-room:not(:disabled):hover{transform:translateY(-2px);box-shadow:var(--shadow)} .hs-room:disabled{opacity:.6}
.hs-thumb{position:relative;display:block;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--bg-2)} .hs-thumb svg{width:100%;height:100%;display:block}
.hs-lock{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.wr-thumb{background:linear-gradient(180deg,#F7E3D0,#E9CBB0)} .wr-rack{position:absolute;left:12%;right:12%;top:22%;bottom:22%;display:flex;gap:6%;border-top:5px solid #8A5A36}
.wr-rack i{flex:1;border-radius:4px 4px 10px 10px;margin-top:6px}
.hs-rm{display:grid;padding:0 4px 4px} .hs-rm b{font-size:15px} .hs-rm small{font-size:12px;color:var(--muted)}
.hs-top{margin-top:8px} .hs-lv{font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}
.hs-scene{position:relative;margin-top:84px;border-radius:22px;overflow:hidden;aspect-ratio:360/420;max-height:calc(100svh - 330px);margin-left:auto;margin-right:auto;box-shadow:0 20px 40px -24px rgba(0,0,0,.45);border:1px solid var(--line)}
.hs-scene svg{width:100%;height:100%;display:block}
.hs-floor{position:absolute;left:10%;right:10%;top:76%;height:4px}
.hs-prev{animation:hspv 1.2s ease-in-out infinite}
@keyframes hspv{50%{filter:brightness(1.12) drop-shadow(0 0 6px #FFD54A)}}
.hs-tabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none} .hs-tabs::-webkit-scrollbar{display:none}
.hs-tab{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--ink);white-space:nowrap}
.hs-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff} .hs-tab.locked{color:var(--muted)}
.hs-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.hs-opt{display:grid;justify-items:center;gap:4px;padding:10px 8px;border-radius:16px;background:var(--surface);border:2px solid var(--line);color:var(--ink);text-align:center}
.hs-opt b{font-size:12.5px;line-height:1.2} .hs-opt.on{border-color:var(--good);background:var(--good-soft)} .hs-opt.pv{border-color:#E2A50C;background:color-mix(in srgb,#FFD54A 18%,var(--surface))}
.hs-sw{position:relative;width:44px;height:44px;border-radius:12px;background:var(--bg-2);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.hs-sw-i{display:grid;place-items:center;height:100%;font-weight:800;color:var(--muted)}
.hs-sw i{position:absolute;inset:0;opacity:.35} .hs-sw i.p-stripes{background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 12px)} .hs-sw i.p-dots{background:radial-gradient(circle,#000 1.5px,transparent 2px) 0 0/9px 9px;opacity:.15} .hs-sw i.p-tiles,.hs-sw i.p-panels,.hs-sw i.p-bricks,.hs-sw i.p-planks,.hs-sw i.p-stone{background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 10px)}
.hs-tag{font-size:11.5px;font-weight:800;color:var(--muted);display:inline-flex;align-items:center;gap:3px} .hs-tag svg{width:12px;height:12px}
.hs-tag.on{color:var(--good)} .hs-tag.buy{color:#B07A00} .hs-tag.price{color:var(--ink)}
.hs-hint{margin:8px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.hs-wr .page-h{margin-top:6px}
@media (prefers-reduced-motion:reduce){ .hs-prev{animation:none} }
.hs-wr .stage{background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 14px,transparent 14px 32px),linear-gradient(180deg,#F3D9B8 0 72%,#B88358 72%);border:1px solid var(--line)}
:root[data-theme="dark"] .hs-wr .stage{background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 14px,transparent 14px 32px),linear-gradient(180deg,#3A2E40 0 72%,#5E4433 72%)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .hs-wr .stage{background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 14px,transparent 14px 32px),linear-gradient(180deg,#3A2E40 0 72%,#5E4433 72%)} }
.hs-wr .page-h h1{font-size:26px}

/* ---- house v2: calmer layout ---- */
.hs2 .page-h{margin-bottom:0}
.hs-badge{position:absolute;left:12px;top:12px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.88);color:#2B1B12;font-weight:800;font-size:13px;backdrop-filter:blur(4px)}
.hs-upline{width:100%;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:700}
.hs-upline em{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-weight:800;color:var(--accent-ink)} .hs-upline em svg{width:15px;height:15px}
.hs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.hs-rc{position:relative;display:block;padding:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--bg-2);aspect-ratio:1/1.05;transition:transform .15s,box-shadow .2s}
.hs-rc:not(:disabled):hover{transform:translateY(-2px);box-shadow:var(--shadow)} .hs-rc.locked{opacity:.55}
.hs-rc-t{position:absolute;inset:0;display:block} .hs-rc-t svg{width:100%;height:100%;display:block}

.hs-rc-l b{font-size:15px} .hs-rc-l small{font-size:11.5px;color:#FFD54A;letter-spacing:.05em;white-space:nowrap}
.hs-rc.locked .hs-rc-l small{color:rgba(255,255,255,.8);letter-spacing:0}
.hs-upchip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:13px;box-shadow:0 2px 0 var(--accent-strong)}
.hs-upchip em{display:inline-flex;align-items:center;gap:2px;font-style:normal;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.22)} .hs-upchip svg{width:13px;height:13px}
.hs2 .hs-scene{margin-top:12px;max-height:calc(100svh - 420px);min-height:240px}
.hs-ed{margin-top:12px;padding:10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.hs-seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;background:var(--bg-2)}
.hs-seg button{padding:8px;border-radius:10px;border:none;background:transparent;font-weight:800;font-size:13.5px;color:var(--muted)}
.hs-seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hs-subs{display:flex;gap:4px;align-items:center;overflow-x:auto;margin:8px 0 6px;scrollbar-width:none} .hs-subs::-webkit-scrollbar{display:none}
.hs-sub{flex:none;padding:5px 10px;border-radius:99px;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--muted)}
.hs-sub.on{background:var(--accent-soft);color:var(--accent-ink)}
.hs-more{flex:none;font-size:11.5px;color:var(--muted);padding-left:4px}
.hs-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none} .hs-row::-webkit-scrollbar{display:none}
.hs-dot{flex:none;display:grid;justify-items:center;gap:3px;padding:0;border:none;background:none;color:var(--ink)}
.hs-sw2{position:relative;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--bg-2);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);font-size:22px;transition:transform .15s}
.hs-dot.on .hs-sw2{box-shadow:0 0 0 3px var(--good)} .hs-dot.pv .hs-sw2{box-shadow:0 0 0 3px #E2A50C;transform:scale(1.06)}
.hs-sw2 i{position:absolute;inset:0;opacity:.35} .hs-sw2 i.p-stripes{background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 12px)} .hs-sw2 i.p-dots{background:radial-gradient(circle,#000 1.5px,transparent 2px) 0 0/9px 9px;opacity:.15} .hs-sw2 i.p-tiles,.hs-sw2 i.p-panels,.hs-sw2 i.p-bricks,.hs-sw2 i.p-planks,.hs-sw2 i.p-stone{background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 10px)}
.hs-check{position:absolute;right:3px;bottom:3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff;font-size:11px}
.hs-dot small{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted)} .hs-dot small svg{width:11px;height:11px}
.hs-cap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;margin-top:6px;padding:0 2px;font-size:13.5px}
.hs-buy{display:inline-flex;align-items:center;gap:4px} .hs-buy svg{width:14px;height:14px}

.hs-wcard{width:100%;margin-top:12px;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:20px;text-align:left;color:var(--ink);background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface) 70%);border:1.5px solid color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:var(--shadow);transition:transform .15s}
.hs-wcard:hover{transform:translateY(-2px)}
.hs-wc-art{position:relative;height:72px;border-radius:14px;background:linear-gradient(180deg,#F7E3D0,#E9CBB0);overflow:hidden}
.hs-wc-main{display:grid;gap:2px} .hs-wc-main b{font-family:var(--f-display);font-size:19px} .hs-wc-main small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hs-wc-go{padding:8px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--accent-strong)}
.hs2 .hs-hero{margin-top:12px}
.hs2 .hs-hero .hs-ext{height:220px}
.hs-grid{margin-top:4px}
.hs-subs{margin:2px 0 8px}
.cw-on #w-hit,.cw-on #wordy-layer *{pointer-events:none!important}
/* ===== owner stats ===== */
.st-box .st-body{display:grid;gap:18px;padding:4px 2px 2px}
.st-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.st-col small{font-size:10.5px;color:var(--muted)}

@media (max-width:620px){ .st-kpi{grid-template-columns:1fr 1fr} .st-two{grid-template-columns:1fr} .st-bars{height:120px} .st-col small{font-size:9.5px} }
/* ===== report an exercise ===== */
.bk-rep{justify-self:start;margin-top:6px;font-size:12.5px;color:var(--muted);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent)}
